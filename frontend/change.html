<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Change Password · College Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: #1a3a8a;
            position: relative;
            overflow-x: hidden;
        }

        /* ---------- ANIMATED BLUE BACKGROUND ---------- */
        .bg-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(145deg, #1a3a8a 0%, #2a5fc1 50%, #1e4a9e 100%);
            overflow: hidden;
            pointer-events: none;
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            filter: blur(90px);
            animation: floatShape 20s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .bg-shape:nth-child(1) {
            width: 600px;
            height: 600px;
            top: -15%;
            left: -10%;
            background: rgba(255, 255, 255, 0.07);
            animation-duration: 24s;
        }
        .bg-shape:nth-child(2) {
            width: 700px;
            height: 700px;
            bottom: -20%;
            right: -10%;
            background: rgba(255, 255, 255, 0.05);
            animation-duration: 28s;
            animation-delay: -5s;
        }
        .bg-shape:nth-child(3) {
            width: 400px;
            height: 400px;
            top: 30%;
            left: 55%;
            background: rgba(255, 255, 255, 0.04);
            animation-duration: 22s;
            animation-delay: -9s;
        }
        .bg-shape:nth-child(4) {
            width: 350px;
            height: 350px;
            bottom: 15%;
            left: 10%;
            background: rgba(255, 255, 255, 0.05);
            animation-duration: 26s;
            animation-delay: -3s;
        }

        @keyframes floatShape {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -30px) scale(1.03); }
            66% { transform: translate(-30px, 40px) scale(0.97); }
            100% { transform: translate(20px, -15px) scale(1.02); }
        }

        .bg-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.04) 0%, transparent 60%);
            animation: glowShift 18s ease-in-out infinite alternate;
        }

        @keyframes glowShift {
            0% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.02); }
            100% { opacity: 0.3; transform: scale(1); }
        }

        /* ---------- CARD ---------- */
        .password-card {
            position: relative;
            z-index: 1;
            max-width: 440px;
            width: 100%;
            background: #FFFFFF;
            border-radius: 36px;
            box-shadow: 0 24px 64px rgba(0, 20, 60, 0.25), 0 8px 24px rgba(0, 0, 0, 0.06);
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(2px);
            transition: box-shadow 0.3s ease, transform 0.2s ease;
            animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            0% { opacity: 0; transform: translateY(24px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .password-card:hover {
            box-shadow: 0 28px 72px rgba(0, 20, 60, 0.3), 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        /* brand header */
        .brand-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }

        .brand-icon {
            font-size: 1.9rem;
            line-height: 1;
            color: #4F6EF7;
            background: rgba(79, 110, 247, 0.08);
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            transition: background 0.2s;
        }

        .brand-name {
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: -0.01em;
            color: #1E293B;
            background: linear-gradient(135deg, #1E293B 0%, #2d3a4f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* heading */
        .form-heading h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #1E293B;
            margin-bottom: 0.15rem;
        }

        .form-sub {
            color: #64748B;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        /* flash messages */
        .flash-message {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .flash-error {
            background: #FEE2E2;
            color: #DC2626;
            border: 1px solid #FCA5A5;
        }
        .flash-success {
            background: #DCFCE7;
            color: #16A34A;
            border: 1px solid #86EFAC;
        }

        /* ---------- INPUTS ---------- */
        .input-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        .input-group label {
            display: block;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1E293B;
            margin-bottom: 0.3rem;
            letter-spacing: -0.01em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.85rem 1rem;
            padding-right: 3rem;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: #FFFFFF;
            border: 1.5px solid #E2E8F0;
            border-radius: 18px;
            outline: none;
            transition: border 0.25s ease-in-out, box-shadow 0.25s ease-in-out;
            color: #1E293B;
        }

        .input-wrapper input:focus {
            border-color: #4F6EF7;
            box-shadow: 0 0 0 4px rgba(79, 110, 247, 0.08), 0 2px 8px rgba(79, 110, 247, 0.02);
        }

        .input-wrapper input::placeholder {
            color: #94A3B8;
            font-weight: 400;
            font-size: 0.9rem;
        }

        .input-group.error .input-wrapper input {
            border-color: #EF4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.05);
        }

        .input-group.error .input-wrapper input:focus {
            border-color: #EF4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.06);
        }

        .error-message {
            font-size: 0.8rem;
            color: #EF4444;
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .input-group.error .error-message {
            opacity: 1;
            transform: translateY(0);
        }

        .error-message i {
            font-size: 0.7rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            background: transparent;
            border: none;
            color: #94A3B8;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, transform 0.15s;
        }

        .toggle-password:hover {
            color: #4F6EF7;
            transform: scale(1.05);
        }

        .toggle-password:focus-visible {
            outline: 2px solid #4F6EF7;
            border-radius: 8px;
        }

        /* ---------- BUTTON ---------- */
        .btn-primary {
            width: 100%;
            background-color: #4F6EF7;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.9rem 1.5rem;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.15s ease, box-shadow 0.3s ease, opacity 0.2s;
            margin-top: 0.5rem;
            font-family: 'Inter', sans-serif;
            letter-spacing: -0.01em;
            box-shadow: 0 4px 14px rgba(79, 110, 247, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s, opacity 0.3s;
            opacity: 0;
        }

        .btn-primary:active::after {
            width: 300px;
            height: 300px;
            opacity: 1;
            transition: width 0s, height 0s, opacity 0.1s;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #3b5de7;
            box-shadow: 0 8px 24px rgba(79, 110, 247, 0.30);
            transform: translateY(-2px);
        }

        .btn-primary:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            box-shadow: 0 2px 10px rgba(79, 110, 247, 0.08);
            transform: scale(0.98);
        }

        .btn-primary .spinner {
            display: inline-block;
            width: 1.1rem;
            height: 1.1rem;
            border: 2.5px solid rgba(255, 255, 255, 0.25);
            border-top: 2.5px solid white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* success message */
        .success-message {
            display: none;
            background: #F0FDF4;
            border: 1px solid #BBF7D0;
            border-radius: 24px;
            padding: 1rem 1.2rem;
            margin-top: 1rem;
            color: #15803D;
            font-weight: 500;
            align-items: center;
            gap: 0.6rem;
            animation: successPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .success-message.show {
            display: flex;
        }

        @keyframes successPop {
            0% { opacity: 0; transform: scale(0.94) translateY(6px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .success-message i {
            font-size: 1.2rem;
        }

        /* footer */
        .form-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.95rem;
            color: #64748B;
        }

        .form-footer a {
            color: #4F6EF7;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1.5px solid transparent;
            transition: border-color 0.2s, color 0.2s;
            position: relative;
        }

        .form-footer a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0;
            height: 2px;
            background: #4F6EF7;
            transition: width 0.25s ease;
        }

        .form-footer a:hover::after {
            width: 100%;
        }

        .form-footer a:hover {
            color: #3b5de7;
        }

        /* password strength indicator */
        .password-strength {
            margin-top: 0.4rem;
            display: flex;
            gap: 0.3rem;
        }
        .password-strength .bar {
            flex: 1;
            height: 4px;
            background: #E2E8F0;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .password-strength .bar.active.weak {
            background: #EF4444;
        }
        .password-strength .bar.active.medium {
            background: #F59E0B;
        }
        .password-strength .bar.active.strong {
            background: #22C55E;
        }
        .strength-text {
            font-size: 0.7rem;
            color: #64748B;
            margin-top: 0.2rem;
        }

        @media (max-width: 520px) {
            .password-card {
                padding: 1.8rem 1.2rem;
                border-radius: 28px;
            }
            .form-heading h1 {
                font-size: 1.4rem;
            }
            .brand-name {
                font-size: 1rem;
            }
            .input-wrapper input {
                padding: 0.8rem 1rem;
                padding-right: 3rem;
                font-size: 0.9rem;
            }
            .btn-primary {
                font-size: 0.95rem;
                padding: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- ANIMATED BLUE BACKGROUND -->
    <div class="bg-container" aria-hidden="true">
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
    </div>

    <!-- PASSWORD CHANGE CARD -->
    <div class="password-card">
        <!-- Brand -->
        <div class="brand-header">
            <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
            <div class="brand-name">College Assistant</div>
        </div>

        <!-- Heading -->
        <div class="form-heading">
            <h1>Change Password</h1>
            <div class="form-sub">Update your account password</div>
        </div>

        <!-- Flash Messages -->
        <div id="flashContainer">
            <!-- Will be populated by JavaScript -->
        </div>

        <!-- Form -->
        <form id="passwordForm" novalidate>
            <!-- Current Password -->
            <div class="input-group" id="currentGroup">
                <label for="currentPassword">Current Password</label>
                <div class="input-wrapper">
                    <input type="password" id="currentPassword" placeholder="Enter your current password" />
                    <button type="button" class="toggle-password" onclick="togglePassword('currentPassword', 'currentIcon')">
                        <i class="fas fa-eye" id="currentIcon"></i>
                    </button>
                </div>
                <div class="error-message"><i class="fas fa-circle-exclamation"></i> <span id="currentError">Please enter your current password.</span></div>
            </div>

            <!-- New Password -->
            <div class="input-group" id="newGroup">
                <label for="newPassword">New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="newPassword" placeholder="Enter your new password" />
                    <button type="button" class="toggle-password" onclick="togglePassword('newPassword', 'newIcon')">
                        <i class="fas fa-eye" id="newIcon"></i>
                    </button>
                </div>
                <div class="password-strength" id="strengthBars">
                    <div class="bar" id="bar1"></div>
                    <div class="bar" id="bar2"></div>
                    <div class="bar" id="bar3"></div>
                    <div class="bar" id="bar4"></div>
                </div>
                <div class="strength-text" id="strengthText">Password must be at least 8 characters</div>
                <div class="error-message"><i class="fas fa-circle-exclamation"></i> <span id="newError">Password must be at least 8 characters.</span></div>
            </div>

            <!-- Confirm Password -->
            <div class="input-group" id="confirmGroup">
                <label for="confirmPassword">Confirm New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Confirm your new password" />
                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', 'confirmIcon')">
                        <i class="fas fa-eye" id="confirmIcon"></i>
                    </button>
                </div>
                <div class="error-message"><i class="fas fa-circle-exclamation"></i> <span id="confirmError">Passwords do not match.</span></div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-primary" id="submitBtn">
                <span id="btnText">Update Password</span>
                <span id="btnSpinner" style="display: none;" class="spinner"></span>
            </button>

            <!-- Success Message -->
            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i> Password updated successfully! Redirecting…
            </div>
        </form>

        <!-- Footer -->
        <div class="form-footer">
            <a href="#" id="backLink">← Back to Chat</a>
        </div>
    </div>

    <script>
        (function() {
            // ----- DOM Elements -----
            const form = document.getElementById('passwordForm');
            const currentPassword = document.getElementById('currentPassword');
            const newPassword = document.getElementById('newPassword');
            const confirmPassword = document.getElementById('confirmPassword');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const successMsg = document.getElementById('successMessage');

            const currentGroup = document.getElementById('currentGroup');
            const newGroup = document.getElementById('newGroup');
            const confirmGroup = document.getElementById('confirmGroup');
            const currentError = document.getElementById('currentError');
            const newError = document.getElementById('newError');
            const confirmError = document.getElementById('confirmError');

            const bar1 = document.getElementById('bar1');
            const bar2 = document.getElementById('bar2');
            const bar3 = document.getElementById('bar3');
            const bar4 = document.getElementById('bar4');
            const strengthText = document.getElementById('strengthText');

            const flashContainer = document.getElementById('flashContainer');

            // ----- Password Toggle -----
            window.togglePassword = function(inputId, iconId) {
                const input = document.getElementById(inputId);
                const icon = document.getElementById(iconId);
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            };

            // ----- Password Strength -----
            function checkPasswordStrength(password) {
                let strength = 0;
                if (password.length >= 8) strength++;
                if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
                if (password.match(/\d/)) strength++;
                if (password.match(/[^a-zA-Z0-9]/)) strength++;
                return strength;
            }

            function updateStrength(password) {
                const bars = [bar1, bar2, bar3, bar4];
                const strength = checkPasswordStrength(password);
                
                bars.forEach((bar, index) => {
                    bar.className = 'bar';
                    if (index < strength) {
                        bar.classList.add('active');
                        if (strength <= 2) bar.classList.add('weak');
                        else if (strength === 3) bar.classList.add('medium');
                        else bar.classList.add('strong');
                    }
                });

                const texts = ['Weak', 'Weak', 'Medium', 'Strong', 'Strong'];
                const colors = ['#EF4444', '#EF4444', '#F59E0B', '#22C55E', '#22C55E'];
                if (password.length === 0) {
                    strengthText.textContent = 'Password must be at least 8 characters';
                    strengthText.style.color = '#64748B';
                } else {
                    strengthText.textContent = `Password strength: ${texts[strength]}`;
                    strengthText.style.color = colors[strength];
                }
            }

            newPassword.addEventListener('input', function() {
                updateStrength(this.value);
                if (this.value.length >= 8) clearError(newGroup);
                else setError(newGroup, newError, 'Password must be at least 8 characters.');
                if (confirmPassword.value.length > 0) validateConfirm();
            });

            confirmPassword.addEventListener('input', function() {
                if (newPassword.value.length > 0) validateConfirm();
            });

            // ----- Validation Helpers -----
            function setError(group, errorSpan, message) {
                group.classList.add('error');
                errorSpan.textContent = message;
            }

            function clearError(group) {
                group.classList.remove('error');
            }

            function validateCurrent() {
                const val = currentPassword.value;
                if (val === '') {
                    setError(currentGroup, currentError, 'Please enter your current password.');
                    return false;
                } else {
                    clearError(currentGroup);
                    return true;
                }
            }

            function validateNew() {
                const val = newPassword.value;
                if (val.length < 8) {
                    setError(newGroup, newError, 'Password must be at least 8 characters.');
                    return false;
                } else {
                    clearError(newGroup);
                    return true;
                }
            }

            function validateConfirm() {
                const pwd = newPassword.value;
                const confirm = confirmPassword.value;
                if (pwd !== confirm) {
                    setError(confirmGroup, confirmError, 'Passwords do not match.');
                    return false;
                } else if (confirm === '') {
                    setError(confirmGroup, confirmError, 'Please confirm your password.');
                    return false;
                } else {
                    clearError(confirmGroup);
                    return true;
                }
            }

            function validateAll() {
                const currentOk = validateCurrent();
                const newOk = validateNew();
                const confirmOk = validateConfirm();
                return currentOk && newOk && confirmOk;
            }

            // ----- Real-time Validation -----
            currentPassword.addEventListener('blur', validateCurrent);
            newPassword.addEventListener('blur', validateNew);
            confirmPassword.addEventListener('blur', validateConfirm);

            currentPassword.addEventListener('input', function() {
                if (this.value !== '') clearError(currentGroup);
            });

            // ----- Flash Messages -----
            function showFlash(message, type) {
                const div = document.createElement('div');
                div.className = `flash-message flash-${type}`;
                div.innerHTML = `<i class="fas fa-circle-exclamation"></i> ${message}`;
                flashContainer.innerHTML = '';
                flashContainer.appendChild(div);
                
                // Auto-hide after 4 seconds
                setTimeout(() => {
                    if (div.parentNode) div.remove();
                }, 4000);
            }

            // ----- Form Submit -----
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const isValid = validateAll();
                if (!isValid) {
                    const firstError = form.querySelector('.input-group.error input');
                    if (firstError) firstError.focus();
                    return;
                }

                // --- Simulate API call ---
                submitBtn.disabled = true;
                btnText.textContent = 'Updating...';
                btnSpinner.style.display = 'inline-block';
                successMsg.classList.remove('show');

                // Simulate async password update
                setTimeout(() => {
                    // Check if current password matches (simulated)
                    const current = currentPassword.value;
                    // In a real app, this would check against the database
                    // For demo, we'll simulate a success
                    
                    submitBtn.disabled = false;
                    btnText.textContent = 'Update Password';
                    btnSpinner.style.display = 'none';

                    // Show success
                    successMsg.classList.add('show');
                    showFlash('Password updated successfully!', 'success');

                    // Redirect after delay
                    setTimeout(() => {
                        alert('Password changed successfully! (Demo) Redirecting to Chat...');
                        // In real app: window.location.href = '/chat';
                        form.reset();
                        successMsg.classList.remove('show');
                        [currentGroup, newGroup, confirmGroup].forEach(g => clearError(g));
                        updateStrength('');
                    }, 1500);
                }, 2000);
            });

            // ----- Back Link -----
            document.getElementById('backLink').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Navigating back to Chat (Demo)');
                // In real app: window.location.href = '/chat';
            });

            // ----- Clear errors on input (optional) -----
            currentPassword.addEventListener('input', function() {
                if (this.value !== '') clearError(currentGroup);
            });
            newPassword.addEventListener('input', function() {
                if (this.value.length >= 8) clearError(newGroup);
                if (confirmPassword.value.length > 0) validateConfirm();
            });
            confirmPassword.addEventListener('input', function() {
                if (this.value === newPassword.value && this.value !== '') clearError(confirmGroup);
            });

            // ----- Initial state -----
            updateStrength('');
        })();
    </script>
</body>
</html>
